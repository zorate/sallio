{% extends 'base.html' %}

{% block title %}Create Account - Sallio{% endblock %}

{% block content %}
<div class="glass-panel" style="max-width: 400px; margin: 0 auto;">
    <h2 class="text-center" style="color: var(--primary-color);">Start Selling</h2>
    <p class="text-center">Create your Sallio business account</p>

    <form id="register-form" method="POST" action="{{ url_for('auth.register') }}" novalidate>
        <div class="form-field">
            <label for="business_name">Business Name <span style="color:#c0392b">*</span></label>
            <input class="form-input" type="text" id="business_name" name="business_name" required
                   autocomplete="organization" placeholder="e.g. Mama Ngozi Provisions">
        </div>
        
        <div class="form-field">
            <label for="owner_name">Your Name <span style="color:#c0392b">*</span></label>
            <input class="form-input" type="text" id="owner_name" name="owner_name" required
                   autocomplete="name" placeholder="Your full name">
        </div>

        <div class="form-field">
            <label for="phone">Phone Number <span style="color:#c0392b">*</span></label>
            <input class="form-input" type="tel" id="phone" name="phone" required
                   autocomplete="tel" placeholder="e.g. 08012345678" inputmode="tel">
        </div>

        <div class="form-field" style="margin-bottom: 24px;">
            <label for="password">Password <span style="color:#c0392b">*</span></label>
            <input class="form-input" type="password" id="password" name="password" required
                   autocomplete="new-password" placeholder="Choose a strong password">
        </div>

        <button type="submit" id="register-btn" class="btn btn-primary">Create Account</button>
    </form>
    
    <div class="text-center" style="margin-top: 24px; font-size: 14px;">
        Already have an account? <a href="{{ url_for('auth.login') }}" style="color: var(--primary-color); text-decoration: none; font-weight: 500;">Log in</a>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
  Sallio.guardForm(document.getElementById('register-form'), 'Creating account...');
</script>
{% endblock %}
