{% extends 'base.html' %}

{% block title %}Log In - Sallio{% endblock %}

{% block content %}
<div class="form-container">
    <div class="glass-panel">
        <h2 class="text-center" style="color: var(--primary-color);">Welcome Back</h2>
        <p class="text-center">Log in to your business</p>

        <form id="login-form" method="POST" action="{{ url_for('auth.login') }}" novalidate>
            <div class="form-field">
                <label for="phone">Phone Number</label>
                <input class="form-input" type="tel" id="phone" name="phone" required
                       autocomplete="tel" placeholder="e.g. 08012345678"
                       inputmode="tel">
            </div>

            <div class="form-field" style="margin-bottom: 24px;">
                <label for="password">Password</label>
                <input class="form-input" type="password" id="password" name="password" required
                       autocomplete="current-password" placeholder="Your password">
            </div>

            <button type="submit" id="login-btn" class="btn btn-primary">Log In</button>
        </form>
        
        <div class="text-center" style="margin-top: 24px; font-size: 14px;">
            Don't have an account? <a href="{{ url_for('auth.register') }}" style="color: var(--primary-color); text-decoration: none; font-weight: 500;">Sign up</a>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
  Sallio.guardForm(document.getElementById('login-form'), 'Logging in...');
</script>
{% endblock %}
